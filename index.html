<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>大文字表示アプリ</title>
    <meta name="description" content="入力した文字を画面いっぱいに大きく表示して、相手に見せるためのアプリ">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">

    <!-- 表示用: Noto Sans JP（ゴシック）/ M PLUS Rounded 1c（丸ゴシック）/ Noto Serif JP（明朝） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@800&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">

    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <!-- 入力画面 -->
    <main id="input-screen" class="screen active">
        <div class="input-container">
            <header>
                <h1>大文字で表示</h1>
                <p class="subtitle">スマホを横にして見せよう</p>
            </header>

            <div class="input-wrap">
                <textarea id="text-input" placeholder="ここに文字を入力..." rows="3" aria-label="表示する文字"></textarea>
                <div class="input-tools">
                    <button id="mic-button" class="tool-button" type="button" aria-label="音声入力" title="音声入力" hidden>
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
                    </button>
                    <button id="fav-add-button" class="tool-button" type="button" aria-label="お気に入りに追加" title="お気に入りに追加">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
                    </button>
                    <button id="clear-button" class="tool-button" type="button" aria-label="入力を消す" title="入力を消す">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>

            <!-- プレビュー -->
            <div id="preview" class="preview" aria-label="プレビュー"><div class="stage"></div></div>

            <div class="action-row">
                <button id="show-button" class="primary-button" type="button">
                    表示する
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                <button id="share-button" class="secondary-button" type="button" aria-label="URLで共有" title="URLで共有">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
                </button>
            </div>
            <p class="hint">Ctrl + Enter でも表示できます</p>

            <!-- 表示設定 -->
            <details class="panel" id="settings-panel" open>
                <summary>表示の設定</summary>

                <div class="field">
                    <span class="field-label">色</span>
                    <div id="color-presets" class="swatches"></div>
                    <div id="custom-colors" class="custom-colors" hidden>
                        <label>文字 <input type="color" id="fg-color"></label>
                        <label>背景 <input type="color" id="bg-color"></label>
                    </div>
                </div>

                <div class="field">
                    <span class="field-label">フォント</span>
                    <div class="segmented" data-setting="font">
                        <button type="button" data-value="gothic">ゴシック</button>
                        <button type="button" data-value="maru">丸ゴシック</button>
                        <button type="button" data-value="mincho">明朝</button>
                    </div>
                </div>

                <div class="field">
                    <span class="field-label">表示方法</span>
                    <div class="segmented" data-setting="mode">
                        <button type="button" data-value="static">通常</button>
                        <button type="button" data-value="blink">点滅</button>
                        <button type="button" data-value="scroll">流れる</button>
                    </div>
                </div>

                <div class="field" id="speed-field">
                    <span class="field-label">流れる速さ</span>
                    <div class="segmented" data-setting="speed">
                        <button type="button" data-value="slow">ゆっくり</button>
                        <button type="button" data-value="normal">ふつう</button>
                        <button type="button" data-value="fast">速い</button>
                    </div>
                </div>

                <div class="field">
                    <span class="field-label">画面の向き</span>
                    <div class="segmented" data-setting="orient">
                        <button type="button" data-value="auto">自動</button>
                        <button type="button" data-value="landscape">横に固定</button>
                        <button type="button" data-value="portrait">縦に固定</button>
                    </div>
                </div>

                <div class="toggles">
                    <label class="toggle"><input type="checkbox" data-setting="vertical"><span>縦書き</span></label>
                    <label class="toggle"><input type="checkbox" data-setting="mirror"><span>鏡文字（左右反転）</span></label>
                    <label class="toggle"><input type="checkbox" data-setting="speakOnShow"><span>表示時に読み上げる</span></label>
                    <label class="toggle" id="fullscreen-toggle"><input type="checkbox" data-setting="browserFullscreen"><span>全画面にする<small>ブラウザが終了方法の案内を表示します。ホーム画面に追加すると、案内なしで全画面になります</small></span></label>
                </div>
            </details>

            <!-- お気に入り・履歴 -->
            <section class="panel lists">
                <div class="tabs" role="tablist">
                    <button type="button" role="tab" class="tab active" data-tab="favorites">お気に入り</button>
                    <button type="button" role="tab" class="tab" data-tab="history">履歴</button>
                </div>
                <ul id="favorites-list" class="item-list"></ul>
                <ul id="history-list" class="item-list" hidden></ul>
                <button id="clear-history-button" class="text-button" type="button" hidden>履歴をすべて消す</button>
            </section>
        </div>
    </main>

    <!-- 表示画面 -->
    <div id="display-screen" class="screen" aria-live="polite">
        <div id="display-area"><div class="stage"></div></div>

        <div id="display-controls" class="controls">
            <span id="position-indicator" class="position" hidden></span>
            <button id="prev-button" class="icon-button" type="button" aria-label="前へ" hidden>
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button id="next-button" class="icon-button" type="button" aria-label="次へ" hidden>
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
            <button id="speak-button" class="icon-button" type="button" aria-label="読み上げ" hidden>
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
            </button>
            <button id="rotate-button" class="icon-button" type="button" aria-label="180度回転">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <button id="close-button" class="icon-button" type="button" aria-label="閉じる">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <p id="display-hint" class="display-hint">ダブルタップで閉じる・左右スワイプで切り替え</p>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="script.js"></script>
</body>
</html>
